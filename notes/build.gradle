// Servus: Notes. Shared configuration lives in the root build.gradle.
// Notes depends on no other Servus mod, so its runs load Notes alone.

dependencies {
    // JEI is optional: only integration/jei touches it, and JEI loads that class only when it is present.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // FTB Teams is optional: only the classes in integration/ftbteams touch it, and only when it is loaded.
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    // -PnotesWithoutFtb runs Notes without FTB Teams, as in a pack that does not have it.
    if (!project.hasProperty('notesWithoutFtb')) {
        localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    }
}

def ownMod = neoForge.mods.getByName(project.mod_id)

neoForge {
    runs {
        configureEach {
            loadedMods = [ownMod]
        }
    }
}

// The codec tests read and write Minecraft codecs without starting the game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Dev only: the screenshots run builds a demo world and saves the store screenshots to runs/screenshots/screenshots.
// Its classes join the mod in dev runs but never the jar, and stay idle unless servus.notes.screenshots is set.
sourceSets {
    screenshots {
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
neoForge.addModdingDependenciesTo(sourceSets.screenshots)
dependencies {
    screenshotsImplementation sourceSets.main.output
}
ownMod.sourceSet(sourceSets.screenshots)

neoForge {
    runs {
        screenshots {
            client()
            sourceSet = sourceSets.screenshots
            gameDirectory = project.file('runs/screenshots')
            systemProperty 'servus.notes.screenshots', 'true'
            programArguments.addAll '--username', 'Servus', '--width', '1920', '--height', '1080'
        }
    }
}
