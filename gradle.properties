# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft and NeoForge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.116
loader_version_range=[4,)

# Test tooling
junit_version=5.11.4

# Optional integrations (soft dependencies, present in dev runs)
jei_version=29.43.0.107
modonomicon_version=2.17.0

# Dev run conveniences only, never shipped
jade_version=26.1.11+neoforge
ftb_library_version=26.1.2.9
ftb_ultimine_version=26.1.2.5
ftb_teams_version=26.1.2.4
ftb_chunks_version=26.1.2.8

# Shared mod metadata. Each mod's id, name and dev version live in its subproject's gradle.properties;
# released versions come from the tag.
# Oldest Foundation that the content mods accept. Pre-releases sort before their release, so 0.3.0 refuses 0.3.0-beta.
foundation_min_version=0.6.0
# Oldest Delicacies that Brewery accepts.
delicacies_min_version=0.1.0-alpha
# Version of the play test pack built by server/pack.ps1.
pack_version=0.1.0
mod_group_id=io.github.dirnei.mc.servus
mod_license=MIT
mod_authors=Dirnei
