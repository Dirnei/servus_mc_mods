# Play test server for the Servus mods. Run pack.ps1 first: it fills ./mods and writes
# versions.env (VERSION and NEOFORGE_VERSION from gradle.properties).
# Start: docker compose up -d     Logs: docker compose logs -f     Stop: docker compose down
services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: servus-playtest
    ports:
      - "25565:25565"
    env_file: versions.env
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      LEVEL: "${LEVEL:-world-26.1}"
      MEMORY: "${MEMORY:-4G}"
      MOTD: "Servus play test"
      DIFFICULTY: normal
      # FALSE lets the Gradle dev client (player "Dev") join, but then anyone can pick any name
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      # Comma separated player names, set them in .env
      OPS: "${OPS:-}"
      WHITELIST: "${WHITELIST:-}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-FALSE}"
      # Mirror ./mods into the server on every start, old jars are removed.
      REMOVE_OLD_MODS: "TRUE"
      TZ: Europe/Vienna
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
    tty: true
    stdin_open: true
    restart: unless-stopped

  # Download page for the players: http://<this computer>:8095 (WEB_PORT in .env)
  web:
    image: nginx:1.27-alpine
    container_name: servus-downloads
    ports:
      - "${WEB_PORT:-8095}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
