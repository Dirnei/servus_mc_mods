# Play test server for the Servus mods. Run pack.ps1 first: it fills ./mods.
# Start: docker compose up -d     Logs: docker compose logs -f     Stop: docker compose down
services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: servus-playtest
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-21.1.255}"
      MEMORY: "${MEMORY:-4G}"
      MOTD: "Servus play test"
      DIFFICULTY: normal
      ONLINE_MODE: "TRUE"
      # Comma separated player names, set them in .env
      OPS: "${OPS:-}"
      WHITELIST: "${WHITELIST:-}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-FALSE}"
      # Mirror ./mods into the server on every start, old jars are removed.
      REMOVE_OLD_MODS: "TRUE"
      TZ: Europe/Vienna
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
    tty: true
    stdin_open: true
    restart: unless-stopped

  # Download page for the players: http://<this computer>:8095 (WEB_PORT in .env)
  web:
    image: nginx:1.27-alpine
    container_name: servus-downloads
    ports:
      - "${WEB_PORT:-8095}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    restart: unless-stopped
