# Replaces the image's default.conf. Bigger header buffers because browsers send every
# cookie other dev apps set for this host, which overflows the 8k default.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    large_client_header_buffers 8 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.(mrpack|zip)$ {
        add_header Content-Disposition attachment;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
    }
}
