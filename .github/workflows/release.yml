name: Release

# Releases one mod per tag: <mod>-v<version>, for example shuttles-v0.2.0 or foundation-v0.3.0-beta.
# The jar gets the tag's version; mod_version in gradle.properties only names dev builds. A version containing "alpha" or
# "beta" is published as that type, anything else as release. The changelog is the "## <version>" section of
# <mod>/CHANGELOG.md; the release fails when that section is missing.
#
# Repository settings:
#   secret   CURSEFORGE_TOKEN            CurseForge API token (curseforge.com, account, API tokens)
#   variable CURSEFORGE_ID_FOUNDATION    project ids from each CurseForge project page;
#   variable CURSEFORGE_ID_ALCHEMY       a mod without an id is released on GitHub only
#   variable CURSEFORGE_ID_SHUTTLES
#   variable CURSEFORGE_ID_DELICACIES
#   variable CURSEFORGE_ID_BREWERY

on:
  push:
    tags:
      - 'foundation-v*'
      - 'alchemy-v*'
      - 'shuttles-v*'
      - 'delicacies-v*'
      - 'brewery-v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          ID_FOUNDATION: ${{ vars.CURSEFORGE_ID_FOUNDATION }}
          ID_ALCHEMY: ${{ vars.CURSEFORGE_ID_ALCHEMY }}
          ID_SHUTTLES: ${{ vars.CURSEFORGE_ID_SHUTTLES }}
          ID_DELICACIES: ${{ vars.CURSEFORGE_ID_DELICACIES }}
          ID_BREWERY: ${{ vars.CURSEFORGE_ID_BREWERY }}
        run: |
          mod="${TAG%%-v*}"
          version="${TAG#*-v}"
          case "$version" in
            *alpha*) type=alpha ;;
            *beta*) type=beta ;;
            *) type=release ;;
          esac
          case "$mod" in
            foundation) cf_id="$ID_FOUNDATION"; deps="" ;;
            alchemy) cf_id="$ID_ALCHEMY"; deps="servus_foundation(required){curseforge:$ID_FOUNDATION}" ;;
            shuttles) cf_id="$ID_SHUTTLES"; deps="servus_foundation(required){curseforge:$ID_FOUNDATION}" ;;
            delicacies) cf_id="$ID_DELICACIES"; deps="servus_foundation(required){curseforge:$ID_FOUNDATION}" ;;
            brewery) cf_id="$ID_BREWERY"; deps="servus_foundation(required){curseforge:$ID_FOUNDATION}, servus_delicacies(required){curseforge:$ID_DELICACIES}" ;;
          esac
          name=$(sed -n 's/^mod_name=//p' "$mod/gradle.properties" | tr -d '\r')
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          changelog=$(awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$mod/CHANGELOG.md")
          if [ -z "$(echo "$changelog" | tr -d '[:space:]')" ]; then
            echo "::error::$mod/CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          {
            echo "mod=$mod"
            echo "version=$version"
            echo "type=$type"
            echo "cf_id=$cf_id"
            echo "deps=$deps"
            echo "name=$name $version"
            echo "mc=$mc"
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :${{ steps.meta.outputs.mod }}:build -Prelease_version_${{ steps.meta.outputs.mod }}=${{ steps.meta.outputs.version }} --no-daemon

      - name: Publish to GitHub and CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          curseforge-id: ${{ steps.meta.outputs.cf_id }}
          curseforge-token: ${{ steps.meta.outputs.cf_id != '' && secrets.CURSEFORGE_TOKEN || '' }}
          files: ${{ steps.meta.outputs.mod }}/build/libs/servus_*-${{ steps.meta.outputs.version }}.jar
          name: ${{ steps.meta.outputs.name }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog: ${{ steps.meta.outputs.changelog }}
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.mc }}
          java: 25
          dependencies: ${{ steps.meta.outputs.deps }}
