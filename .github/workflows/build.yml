name: Build

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs this build first and publishes only when it passes.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: servus-mods
          path: |
            foundation/build/libs/*.jar
            alchemy/build/libs/*.jar
            shuttles/build/libs/*.jar
            delicacies/build/libs/*.jar
            brewery/build/libs/*.jar
          if-no-files-found: error
