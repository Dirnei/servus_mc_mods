name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: servus-mods
          path: |
            lib/build/libs/*.jar
            manufacturing/build/libs/*.jar
            logistics/build/libs/*.jar
            storage/build/libs/*.jar
          if-no-files-found: error
