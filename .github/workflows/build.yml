name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Check the docs game data export is current
        run: |
          ./gradlew :manufacturing:runData --no-daemon
          if ! git diff --exit-code -- docs/src/data/gamedata.json; then
            echo "::error file=docs/src/data/gamedata.json::docs/src/data/gamedata.json is out of date. Run ./gradlew :manufacturing:runData and commit the file."
            exit 1
          fi

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: servus-mods
          path: |
            lib/build/libs/*.jar
            manufacturing/build/libs/*.jar
            logistics/build/libs/*.jar
            storage/build/libs/*.jar
          if-no-files-found: error
