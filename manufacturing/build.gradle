// Servus: Manufacturing. Shared configuration lives in the root build.gradle.
evaluationDependsOn(':foundation')
evaluationDependsOn(':logistics')

dependencies {
    // Compile against Foundation and Logistics, but do not put their jars on the run
    // classpath: the run already loads both from their source sets via
    // loadedMods below. Using implementation here makes FML see them twice.
    compileOnly project(':foundation')
    testImplementation project(':foundation')
    // Manufacturing's ducts are the Logistics Utility Duct.
    compileOnly project(':logistics')
    testImplementation project(':logistics')
    // The game data reader is plain Gson; Minecraft 1.21.1 ships this version.
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // JEI: API at compile time, full mod only in dev runs (soft dependency).
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Playtest conveniences in dev runs only: block info and vein mining.
    localRuntime "maven.modrinth:jade:${jade_version}"
    // FTB Library pulls Architectury in through its own metadata.
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime("dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}") {
        // Only Ultimine itself; its metadata also lists Ranks and EZ Crystals.
        exclude group: 'dev.ftb.mods', module: 'ftb-ranks-neoforge'
        exclude group: 'dev.ftb.mods', module: 'ftb-ez-crystals'
    }
}

// Resolved outside the neoForge block: inside it, project(':foundation') would be
// read as a dependency notation instead of the Gradle project.
def foundationMod = project(':foundation').neoForge.mods.getByName('servus_foundation')
def logisticsMod = project(':logistics').neoForge.mods.getByName('servus_logistics')
def ownMod = neoForge.mods.getByName(project.mod_id)

neoForge {
    runs {
        configureEach {
            // Manufacturing is always launched together with Servus: Foundation and Servus: Logistics.
            loadedMods = [ownMod, foundationMod, logisticsMod]
        }
        data {
            // Game data export for the documentation site (docs/).
            systemProperty 'servus.gamedata.output', rootProject.file('docs/src/data/gamedata.json').absolutePath
            systemProperty 'servus.gamedata.resources', file('src/main/resources').absolutePath
            // Recipes and lang of every Servus mod, read as files so mods not loaded here still take part.
            systemProperty 'servus.gamedata.generated', ['foundation', 'logistics', 'manufacturing', 'storage']
                    .collect { rootProject.file("${it}/src/generated/resources").absolutePath }
                    .join(File.pathSeparator)
        }
    }
}

// The export reads the other mods' generated recipes, so `gradlew runData` writes them first.
tasks.matching { it.name == 'runData' }.configureEach {
    mustRunAfter ':foundation:runData', ':logistics:runData', ':storage:runData'
}
