// Servus: Manufacturing. Shared configuration lives in the root build.gradle.
evaluationDependsOn(':lib')

dependencies {
    // Compile against Lib, but do not put its jar on the run classpath: the run
    // already loads Lib from its source set via loadedMods below. Using
    // implementation here makes FML see servus_lib twice.
    compileOnly project(':lib')
    testImplementation project(':lib')

    // JEI: API at compile time, full mod only in dev runs (soft dependency).
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Playtest conveniences in dev runs only: block info and vein mining.
    localRuntime "maven.modrinth:jade:${jade_version}"
    // FTB Library pulls Architectury in through its own metadata.
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}"
}

// Resolved outside the neoForge block: inside it, project(':lib') would be
// read as a dependency notation instead of the Gradle project.
def libMod = project(':lib').neoForge.mods.getByName('servus_lib')
def ownMod = neoForge.mods.getByName(project.mod_id)

neoForge {
    runs {
        configureEach {
            // Content mods are always launched together with Servus Lib.
            loadedMods = [ownMod, libMod]
        }
    }
}
