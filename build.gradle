plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Repositories for every project, including the root run configurations.
allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
            content {
                includeGroup 'mezz.jei'
                includeGroupByRegex 'net\\.mezzdev.*'
            }
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev'
            content {
                includeGroup 'dev.architectury'
            }
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        maven {
            name = 'KliKli'
            url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
            content {
                includeGroup 'com.klikli_dev'
            }
        }
        maven {
            name = 'FTB'
            url = 'https://maven.ftb.dev/releases'
            content {
                includeGroup 'dev.ftb.mods'
            }
        }
    }
}

// Shared configuration for the four mod projects. Each subproject only adds
// what differs: its mod id and name (gradle.properties), dependencies and
// which mods its runs load (build.gradle).
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'
    apply plugin: 'idea'

    version = rootProject.mod_version
    group = rootProject.mod_group_id

    base {
        archivesName = project.mod_id
    }

    // Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    sourceSets.main.resources {
        // Include resources generated by data generators.
        srcDir('src/generated/resources')
        // Exclude development only resources from the jar.
        exclude('**/*.bbmodel')
        exclude('src/generated/**/.cache')
    }

    neoForge {
        version = rootProject.neo_version

        parchment {
            minecraftVersion = rootProject.parchment_minecraft_version
            mappingsVersion = rootProject.parchment_mappings_version
        }

        validateAccessTransformers = true

        mods {
            "${project.mod_id}" {
                sourceSet(sourceSets.main)
            }
        }

        runs {
            client {
                client()
                gameDirectory = project.file('runs/client')
            }
            server {
                server()
                programArgument '--nogui'
                gameDirectory = project.file('runs/server')
            }
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = project.file('runs/gametest')
            }
            data {
                data()
                gameDirectory = project.file('runs/data')
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', file('src/generated/resources/').getAbsolutePath(),
                        '--existing', file('src/main/resources/').getAbsolutePath()
            }
            configureEach {
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }

    // Expands the neoforge.mods.toml template of each mod with the shared versions.
    def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
        def replaceProperties = [
                minecraft_version      : rootProject.minecraft_version,
                minecraft_version_range: rootProject.minecraft_version_range,
                neo_version            : rootProject.neo_version,
                loader_version_range   : rootProject.loader_version_range,
                mod_id                 : project.mod_id,
                mod_name               : project.mod_name,
                mod_description        : project.mod_description,
                mod_license            : rootProject.mod_license,
                mod_version            : rootProject.mod_version,
                mod_authors            : rootProject.mod_authors,
                foundation_version_range: "[${rootProject.mod_version},)".toString(),
        ]
        inputs.properties replaceProperties
        expand replaceProperties
        from 'src/main/templates'
        into 'build/generated/sources/modMetadata'
    }
    sourceSets.main.resources.srcDir generateModMetadata
    neoForge.ideSyncTask generateModMetadata

    // Dependencies present at runtime for testing but not published to dependents.
    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// Combined run configurations that load all four mods together. The root
// project has no sources of its own; it only hosts these runs.
apply plugin: 'net.neoforged.moddev'

evaluationDependsOnChildren()

def allServusMods = ['foundation', 'manufacturing', 'storage'].collect { name ->
    def sub = project(":${name}")
    sub.neoForge.mods.getByName(sub.mod_id)
}
def allServusModIds = allServusMods.collect { it.name }.join(',')

neoForge {
    version = project.neo_version

    runs {
        clientAll {
            client()
            gameDirectory = project.file('runs/client')
        }
        serverAll {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
        }
        gameTestServerAll {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
        }
        // Renders every item of docs/src/data/gamedata.json as an icon for the docs site, then quits.
        iconExport {
            client()
            gameDirectory = project.file('runs/icons')
            systemProperty 'servus.icons.output', project.file('docs/src/icons').absolutePath
            systemProperty 'servus.icons.gamedata', project.file('docs/src/data/gamedata.json').absolutePath
        }
        configureEach {
            loadedMods = allServusMods
            systemProperty 'neoforge.enabledGameTestNamespaces', allServusModIds
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}


tasks.register('iconExport') {
    group = 'servus'
    description = 'Renders the item icons for the docs site (docs/src/icons).'
    dependsOn 'runIconExport'
}

// The combined runs carry the same dev only mods as the Manufacturing runs.
dependencies {
    // Manufacturing's journal is a Modonomicon book; the combined runs need the mod.
    runtimeOnly "com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    runtimeOnly("dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}") {
        // Only Ultimine itself; its metadata also lists Ranks and EZ Crystals.
        exclude group: 'dev.ftb.mods', module: 'ftb-ranks-neoforge'
        exclude group: 'dev.ftb.mods', module: 'ftb-ez-crystals'
    }
}

tasks.named('jar').configure {
    enabled = false
}
